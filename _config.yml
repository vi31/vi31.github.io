title: Vibha Govind Hegde
description: "[Site description: one sentence for search results and link previews.]"
url: "https://vi31.github.io"
baseurl: ""
lang: en

author:
  name: Vibha Govind Hegde

# Footer and About links. "#" = not supplied yet; replace with the real URL.
profiles:
  github: "https://github.com/vi31"
  linkedin: "#"
  email: "#"          # use a full mailto: address, e.g. "mailto:you@example.com"

# Contact form (About page). Create a form at formspree.io and paste its URL here.
form_endpoint: "https://formspree.io/f/[FORM_ID]"

# No pre-made theme. The github-pages gem would otherwise apply "primer" by default.
theme: null

# No auto-generated excerpts: a post's `excerpt:` front matter is the only blurb.
excerpt_separator: ""

plugins:
  - jekyll-feed
  - jekyll-seo-tag

permalink: /blog/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/
  teardowns:
    output: true
    permalink: /teardowns/:name/

defaults:
  # `image` is the default social-share picture (1200x630). Any page can set its own `image:`.
  - scope: { path: "" }
    values: { layout: default, image: /assets/img/og-image.png }
  - scope: { path: "", type: projects }
    values: { section: projects, layout: project }
  - scope: { path: "", type: teardowns }
    values: { section: teardowns, layout: teardown }
  - scope: { path: "", type: posts }
    values: { section: blog, layout: post }

exclude:
  - portfolio-handoff
  - .claude
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - tools
  - node_modules
