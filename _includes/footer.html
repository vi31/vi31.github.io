<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>© {{ site.time | date: "%Y" }} {{ site.author.name }} · Icons: <a href="https://lucide.dev">Lucide</a> (ISC)</span>
    <span class="footer-links">
      <a href="{{ site.profiles.github }}">GitHub</a>
      <a href="{{ site.profiles.linkedin }}">LinkedIn</a>
      {% if page.url == '/blog/' %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      {% elsif page.section != 'about' %}
      <a href="{{ site.profiles.email }}">Email</a>
      {% endif %}
    </span>
  </div>
</footer>
