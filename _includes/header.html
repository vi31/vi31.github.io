<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <img class="logo-dark" src="{{ '/assets/img/logo-dark.png' | relative_url }}" alt="Vibha Hegde" width="211" height="64">
      <img class="logo-light" src="{{ '/assets/img/logo-light.png' | relative_url }}" alt="Vibha Hegde" width="211" height="64">
    </a>
    <nav class="nav" aria-label="Primary">
      <div class="nav-links">
        <a href="{{ '/projects/' | relative_url }}"{% if page.section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/teardowns/' | relative_url }}"{% if page.section == 'teardowns' %} aria-current="page"{% endif %}>Teardowns</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.section == 'blog' %} aria-current="page"{% endif %}>Blog</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.section == 'about' %} aria-current="page"{% endif %}>About</a>
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme">
        <svg class="icon-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="icon-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
      </button>
    </nav>
  </div>
</header>
